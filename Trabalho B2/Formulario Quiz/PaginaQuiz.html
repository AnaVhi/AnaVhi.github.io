<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Cantor</title>
    <link rel="stylesheet" href="Pagina Quiz.css">
    <link rel="shortcut icon" href="icone.png" type="image/x-icon">
</head>
<body>
    <h1>Quiz do Cantor</h1>
    <form id="formulario" onsubmit="return mostrarMensagem();">
            <!-- Campo Nome Completo -->
        <label for="nome_completo">Nome Completo:</label><br>
        <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite o nome completo de James Arthur..." required><br><br>

        <!-- Campo Primeira Música Popular em Dueto -->
        <label for="primeira_musica_dueto">Primeira Música Popular em Dueto:</label><br>
        <input type="text" id="primeira_musica_dueto" name="primeira_musica_dueto" placeholder="escrema o nome da música..." required><br><br>

        <!-- Campo Nome do Primeiro Álbum -->
        <label for="primeiro_album">Nome do Primeiro Álbum:</label><br>
        <input type="text" id="primeiro_album" name="primeiro_album" placeholder="Escreva o nome do álbum..." required><br><br>

        <!-- Campo Local de Nascimento -->
        <label for="local_nascimento">Local de Nascimento:</label><br>
        <input type="date" id="local_nascimento" name="local_nascimento" required><br><br>

        <!-- Botão de Enviar -->
        <input type="submit" value="Enviar">
    </form>
    
    <script>
        // Função para mostrar a mensagem de sucesso
        function mostrarMensagem() {
            alert("Formulário enviado com sucesso!");
            return false; 
        }
    </script>

</body>
</html>
